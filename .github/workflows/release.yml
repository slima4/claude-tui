name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" --title "${TAG}" --generate-notes

      - name: Compute tarball SHA256
        id: sha
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          SHA256=$(curl -sL "${URL}" | sha256sum | awk '{print $1}')
          {
            echo "sha256=${SHA256}"
            echo "url=${URL}"
          } >> "${GITHUB_OUTPUT}"
          echo "url:    ${URL}"
          echo "sha256: ${SHA256}"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: slima4/homebrew-claude-tui
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        env:
          TAG: ${{ github.ref_name }}
          URL: ${{ steps.sha.outputs.url }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        # `|` as sed delimiter so the URL's slashes don't conflict.
        # The `revision N` line is removed because revision resets to implicit 0
        # on a new upstream tag — we only need it for formula-only fixes against
        # an already-released tarball.
        run: |
          cd tap
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/claude-tui.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/claude-tui.rb
          sed -i "/^ *revision /d" Formula/claude-tui.rb
          echo "--- formula head after edit ---"
          head -10 Formula/claude-tui.rb

      - name: Open PR against tap
        # peter-evans/create-pull-request handles branch create + commit + push +
        # PR open in one step. Auth uses the same PAT as checkout so the PR
        # author triggers the tap's CI workflow (test-formula.yml).
        uses: peter-evans/create-pull-request@v6
        with:
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: bump-${{ github.ref_name }}
          delete-branch: true
          commit-message: "Update claude-tui to ${{ github.ref_name }}"
          title: "Update claude-tui to ${{ github.ref_name }}"
          body: |
            Automated formula bump from [`${{ github.repository }}@${{ github.ref_name }}`](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}).

            - **URL:** `${{ steps.sha.outputs.url }}`
            - **SHA256:** `${{ steps.sha.outputs.sha256 }}`

            Tap CI will validate this bump on merge candidates. Review the diff,
            wait for the `Test formula` checks to go green, then merge.
