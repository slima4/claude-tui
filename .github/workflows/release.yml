name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to dry-run the tap-PR flow against (e.g. v0.8.4). No GitHub Release is created; a throwaway formula change opens a tap PR that is immediately closed to prove HOMEBREW_TAP_TOKEN has Contents + Pull requests write."
        required: true

permissions:
  contents: write

# Serialize per tag: a re-pushed tag or a dispatch overlapping a real
# release must not race two runs on the same bump-<tag> branch / tap.
# cancel-in-progress stays false — never kill a release mid tap-push.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The tag to operate on: the pushed tag for a real release, or the
      # dispatch input for a dry run. Every downstream step reads RELEASE_TAG,
      # never github.ref_name directly — on workflow_dispatch ref_name is a
      # branch (main), not a tag, which would break the URL/branch/sed logic.
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create GitHub Release
        # Real releases only. A dry run reuses an already-released tag's
        # tarball and must not create or mutate a Release.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release create "${TAG}" --title "${TAG}" --generate-notes

      - name: Compute tarball SHA256
        id: sha
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          # --fail: a non-2xx (e.g. tag tarball not yet published) is a hard
          # error, not an HTML/0-byte body silently hashed into a bogus
          # sha256 that ships to the tap and breaks `brew install` for users.
          # --retry-all-errors: the codeload tarball can lag a few seconds
          # behind the GitHub Release, so retry through transient 404s too.
          curl --fail --location --silent --show-error \
               --retry 5 --retry-delay 3 --retry-all-errors \
               -o tarball.tgz "${URL}"
          SHA256=$(sha256sum tarball.tgz | awk '{print $1}')
          if ! printf '%s' "${SHA256}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Computed SHA256 is not a 64-hex digest: '${SHA256}'"
            exit 1
          fi
          rm -f tarball.tgz
          {
            echo "sha256=${SHA256}"
            echo "url=${URL}"
          } >> "${GITHUB_OUTPUT}"
          echo "url:    ${URL}"
          echo "sha256: ${SHA256}"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: slima4/homebrew-claude-tui
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        env:
          TAG: ${{ env.RELEASE_TAG }}
          URL: ${{ steps.sha.outputs.url }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        # `|` as sed delimiter so the URL's slashes don't conflict.
        # The `revision N` line is removed because revision resets to implicit 0
        # on a new upstream tag — we only need it for formula-only fixes against
        # an already-released tarball.
        run: |
          cd tap
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/claude-tui.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/claude-tui.rb
          sed -i "/^ *revision /d" Formula/claude-tui.rb
          echo "--- formula head after edit ---"
          head -10 Formula/claude-tui.rb

      - name: Force a diff for the dry run
        # Dry-running against an already-released tag yields no formula change
        # (url/sha already current), so peter-evans would no-op and never
        # exercise the token's Pull requests scope — the exact thing we want
        # to validate. Append a unique throwaway line so a branch is always
        # pushed and a PR always opened; it is discarded when the dry-run PR
        # and its branch are deleted below, so the tap is never mutated.
        if: env.DRY_RUN == 'true'
        run: |
          cd tap
          echo "# dry-run token check ${GITHUB_RUN_ID} $(date -u +%FT%TZ)" >> Formula/claude-tui.rb

      - name: Open PR against tap
        # peter-evans/create-pull-request handles branch create + commit + push +
        # PR open in one step. Auth uses the same PAT as checkout so the PR
        # author triggers the tap's CI workflow (test-formula.yml).
        #
        # HOMEBREW_TAP_TOKEN must be a fine-grained PAT scoped to
        # slima4/homebrew-claude-tui with BOTH:
        #   - Contents: Read and write       (push the bump branch)
        #   - Pull requests: Read and write  (open the PR)
        # A token with only Contents pushes the branch fine but fails PR
        # creation with "Resource not accessible by personal access token".
        id: tap_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: bump-${{ env.RELEASE_TAG }}
          delete-branch: true
          commit-message: "Update claude-tui to ${{ env.RELEASE_TAG }}"
          title: "${{ env.DRY_RUN == 'true' && '[dry-run] ' || '' }}Update claude-tui to ${{ env.RELEASE_TAG }}"
          body: |
            Automated formula bump from [`${{ github.repository }}@${{ env.RELEASE_TAG }}`](https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}).

            - **URL:** `${{ steps.sha.outputs.url }}`
            - **SHA256:** `${{ steps.sha.outputs.sha256 }}`

            Tap CI will validate this bump on merge candidates. Review the diff,
            wait for the `Test formula` checks to go green, then merge.

      - name: Surface manual recovery if PR step failed
        # peter-evans does push-branch THEN open-PR in one step, so a failure
        # can be at either stage and the two need different recovery:
        #   - branch pushed, PR-open failed  -> Pull requests scope missing;
        #     recover with `gh pr create` against the existing branch.
        #   - push itself failed             -> Contents scope missing; there
        #     is no branch, so `gh pr create` would also fail. Fix the PAT
        #     and re-run.
        # Don't guess which: query the tap for the branch as ground truth.
        # The tap is a public Homebrew tap, so an unauthenticated ls-remote
        # is sufficient and never exposes HOMEBREW_TAP_TOKEN.
        if: steps.tap_pr.outcome == 'failure'
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="bump-${TAG}"
          TAP="slima4/homebrew-claude-tui"
          if git ls-remote --exit-code --heads \
               "https://github.com/${TAP}.git" "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            {
              echo "## Tap PR step failed (branch pushed, PR not opened)"
              echo
              echo "The \`${BRANCH}\` branch was pushed to ${TAP} with the"
              echo "correct url/sha256, but the PR could not be opened."
              echo "Most likely cause: \`HOMEBREW_TAP_TOKEN\` is missing the"
              echo "\`Pull requests: Read and write\` permission on the tap repo."
              echo
              echo "Finish the release manually:"
              echo
              echo '```'
              echo "gh pr create --repo ${TAP} \\"
              echo "  --base main --head ${BRANCH} \\"
              echo "  --title \"claude-tui ${TAG}\" \\"
              echo "  --body \"Automated formula bump for ${TAG}.\""
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::Tap PR not opened. Branch ${BRANCH} pushed; open the PR manually (see job summary)."
          else
            {
              echo "## Tap PR step failed (branch NOT pushed)"
              echo
              echo "The \`${BRANCH}\` branch does not exist on ${TAP}: the push"
              echo "itself failed, so there is no branch to open a PR from and"
              echo "\`gh pr create\` would also fail."
              echo "Cause: \`HOMEBREW_TAP_TOKEN\` is missing the"
              echo "\`Contents: Read and write\` permission on the tap repo,"
              echo "or its repository access does not include ${TAP}."
              echo
              echo "Recovery: fix the PAT scopes (Contents + Pull requests,"
              echo "both Read and write; repo access scoped to ${TAP}), then"
              echo "re-run the release for tag \`${TAG}\`. Validate the token"
              echo "without cutting a release with a dry run:"
              echo
              echo '```'
              echo "gh workflow run release.yml --repo ${REPO} -f tag=${TAG}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::Tap branch ${BRANCH} was not pushed (HOMEBREW_TAP_TOKEN missing Contents: write). Fix the PAT and re-run (see job summary)."
          fi
          exit 1

      - name: Close dry-run PR
        # A dry run exists only to prove HOMEBREW_TAP_TOKEN can push a branch
        # AND open a PR on the tap. Once the PR exists the token is proven, so
        # close it and delete the branch to leave no residue (the throwaway
        # formula line goes with it). Closing also re-exercises the
        # pull-requests:write scope. Runs only when the PR step succeeded and
        # actually produced a PR.
        if: env.DRY_RUN == 'true' && steps.tap_pr.outcome == 'success' && steps.tap_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PR: ${{ steps.tap_pr.outputs.pull-request-number }}
          BRANCH: bump-${{ env.RELEASE_TAG }}
        run: |
          echo "Dry run: closing tap PR #${PR} and deleting branch ${BRANCH}"
          gh pr close "${PR}" --repo slima4/homebrew-claude-tui --delete-branch
          {
            echo "## Dry run OK"
            echo
            echo "\`HOMEBREW_TAP_TOKEN\` pushed branch \`${BRANCH}\`, opened tap"
            echo "PR #${PR}, and closed it. Contents + Pull requests write"
            echo "scopes confirmed. No residue left on the tap."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail if dry run did not open a PR
        # Belt-and-suspenders: if the PR step "succeeded" but produced no PR
        # (e.g. token silently lacked scope, or no diff), the close step is
        # skipped and the token is NOT proven. Make that loud instead of green.
        if: env.DRY_RUN == 'true' && (steps.tap_pr.outcome != 'success' || steps.tap_pr.outputs.pull-request-number == '')
        run: |
          echo "::error::Dry run did not open a tap PR (outcome=${{ steps.tap_pr.outcome }}, pr=${{ steps.tap_pr.outputs.pull-request-number }}). HOMEBREW_TAP_TOKEN scopes NOT confirmed."
          exit 1
